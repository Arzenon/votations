# Development stack. Not named docker-compose.yml, so that a bare
# `docker compose up` never starts it by mistake in production.
#
#   docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: votations
      POSTGRES_PASSWORD: votations
      POSTGRES_DB: votations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votations"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Built once and reused by the job services below.
    image: votations-app:dev
    build:
      context: .
      # Tests and dev tools are only in the `dev` stage.
      target: dev
    depends_on:
      db:
        condition: service_healthy
    # Your `.env`, as in production. `environment` below takes precedence.
    # Optional, so a fresh clone starts without one.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://votations:votations@db:5432/votations
      TEST_DATABASE_URL: postgresql+psycopg://votations:votations@db:5432/votations_test
      SECRET_KEY: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      MIN_BUCKET_VOLUME: "50"
      MIN_CELL_COUNT: "10"
      # No proxy locally: ignore X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "0"
      # Optional: enables AI drafts in the admin.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Seed sample laws on startup (set to 0 to disable).
      SEED_ON_START: "0"
    ports:
      - "8000:8000"
    volumes:
      # Live code reload.
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # INSEE reference refresh. Same image, without the app entrypoint (no
  # migrations or seed).
  insee-refresh:
    image: votations-app:dev
    # Built by `app`, not pulled from a registry.
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    # Your `.env`, as in production. `environment` below takes precedence.
    # Optional, so a fresh clone starts without one.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://votations:votations@db:5432/votations
      INSEE_REFRESH_INTERVAL: "2592000"   # 30 days
      # INSEE_API_KEY: ""                 # optional, the dataset is open
    entrypoint: ["./docker/insee_cron.sh"]
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts

  # Daily import from the Assemblée nationale. Same image, without the app
  # entrypoint. Imported laws need an admin action to be published.
  assemblee-refresh:
    image: votations-app:dev
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    # Your `.env`, as in production. `environment` below takes precedence.
    # Optional, so a fresh clone starts without one.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://votations:votations@db:5432/votations
      AN_REFRESH_INTERVAL: "86400"        # 24 hours
      # AN_IMPORT_SINCE: "2026-01-01"     # empty imports the full backlog
    entrypoint: ["./docker/assemblee_cron.sh"]
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts

volumes:
  pgdata:
