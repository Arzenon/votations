[project]
name = "votations"
version = "0.1.0"
description = "Votations Françaises — Citizens' voice on French legislation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Upper bound: the major version already changed once (1.x). Keeps installs
    # outside Docker on the same major as the lockfile.
    "anthropic>=1,<2",
    # Entity-expansion-safe XML parsing for the Journal Officiel archives.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.14",
    # Type stubs. Pillow isn't a dependency (see `scripts/make_og_image.py`).
    "types-defusedxml>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Migrations are autogenerated; don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (security)
    "SIM",  # simplifications
    "C4",   # comprehensions
    "DTZ",  # naive datetimes: the bug class behind the vote-window offset
    "RUF",  # ruff's own rules
    "PIE",
    "RET",
    "LOG",
]
ignore = [
    # Calling Depends()/Form() in argument defaults is the idiomatic FastAPI pattern.
    "B008",
    # French error messages are written inline.
    "TRY003",
    # Allow typographic apostrophes and « » in French text.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fake secrets.
"tests/*" = ["S101", "S105", "S106", "S311", "ARG001", "SLF001"]
# Seeded random for sample data, not for secrets.
"scripts/seed.py" = ["S311"]

[tool.mypy]
python_version = "3.14"
files = ["app", "scripts"]

# Not strict: route handlers don't need annotations (FastAPI validates them).
# check_untyped_defs still checks their bodies.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
disallow_any_generics = false

[[tool.mypy.overrides]]
# Pillow is only used by scripts/make_og_image.py, run by hand.
module = ["PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
