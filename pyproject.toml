[project]
name = "votations"
version = "0.1.0"
description = "Votations Françaises — Citizens' voice on French legislation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.69",
    # Entity-expansion-safe XML parsing for the Journal Officiel archives.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are autogenerated; don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit — security smells
    "SIM",  # simplifications
    "C4",   # comprehensions
    "DTZ",  # naive datetimes: the bug class behind the vote-window offset
    "RUF",  # ruff's own rules
    "PIE",
    "RET",
    "LOG",
]
ignore = [
    # Calling Depends()/Form() in argument defaults is the idiomatic FastAPI pattern.
    "B008",
    # French error messages are written for the person reading them, not extracted
    # into constants.
    "TRY003",
    # Ambiguous-unicode flags the typographic apostrophes and « » the French copy
    # uses on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on fixtures they receive but do not name, and use obvious fake
# secrets by design.
"tests/*" = ["S101", "S105", "S106", "S311", "ARG001", "SLF001"]
# Seeding sample data uses a seeded PRNG for reproducibility, not for secrets.
"scripts/seed.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
