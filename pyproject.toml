[project]
name = "votations"
version = "0.1.0"
description = "Votations Françaises — Citizens' voice on French legislation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # The one dependency here with an upper bound, because it is the one whose
    # major version has already moved under us once. 1.x replaced `httpx` with
    # `httpx2` and dropped surface this project never used; a future 2.x is a
    # decision to take deliberately, not something a fresh `pip install -e .`
    # should make on its own — the lockfile pins the exact version for the image,
    # and this keeps a non-Docker install on the same major as the image.
    "anthropic>=1,<2",
    # Entity-expansion-safe XML parsing for the Journal Officiel archives.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.14",
    # Stubs for the one third-party import mypy cannot infer. Pillow is
    # deliberately absent: it builds `app/static/og.png` by hand and is not a
    # dependency of the application — see `scripts/make_og_image.py`.
    "types-defusedxml>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are autogenerated; don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit — security smells
    "SIM",  # simplifications
    "C4",   # comprehensions
    "DTZ",  # naive datetimes: the bug class behind the vote-window offset
    "RUF",  # ruff's own rules
    "PIE",
    "RET",
    "LOG",
]
ignore = [
    # Calling Depends()/Form() in argument defaults is the idiomatic FastAPI pattern.
    "B008",
    # French error messages are written for the person reading them, not extracted
    # into constants.
    "TRY003",
    # Ambiguous-unicode flags the typographic apostrophes and « » the French copy
    # uses on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on fixtures they receive but do not name, and use obvious fake
# secrets by design.
"tests/*" = ["S101", "S105", "S106", "S311", "ARG001", "SLF001"]
# Seeding sample data uses a seeded PRNG for reproducibility, not for secrets.
"scripts/seed.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]

# Deliberately not `strict`. The point here is to check the types the code
# already declares — and this codebase declares a lot of them, on every model
# column, every CRUD signature and every helper — rather than to demand an
# annotation on each of the forty route handlers, whose signatures FastAPI
# already reads and validates at runtime. `check_untyped_defs` is what makes the
# unannotated bodies get checked anyway, which is where the value is.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
# An `Any` that arrives from an untyped third-party call is silent by design;
# one produced by our own code usually means a signature that lost its type.
disallow_any_generics = false

[[tool.mypy.overrides]]
# Pillow is a tool for regenerating one committed PNG, not a dependency; the
# script that imports it is run by hand from a throwaway virtualenv.
module = ["PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
