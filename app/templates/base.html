<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Votations Françaises{% endblock %}</title>
  <meta name="description" content="{% block description %}Donnez votre avis sur les lois adoptées par le Parlement : présentation neutre et sourcée, données ouvertes, aucune donnée personnelle collectée.{% endblock %}">
  <meta property="og:site_name" content="Votations Françaises">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="/">Votations&nbsp;Françaises</a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="/recherche">Rechercher</a>
        <a href="/connexion">{{ auth.login_label }}</a>
      </nav>
    </div>
  </header>

  <div class="disclaimer" role="note">
    <div class="container">⚠️ {{ DISCLAIMER }}</div>
  </div>

  <main class="container" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        Données publiées en accès libre, anonymisées.
        La plateforme ne prend aucune position et ne formule aucune recommandation.
      </p>
      <p><a href="/connexion">À propos de l'authentification</a></p>
    </div>
  </footer>
</body>
</html>
