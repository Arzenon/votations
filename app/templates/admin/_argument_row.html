{# One argument: quote, author, source. No index in the field names: rows are
   matched by position (see `ArgumentRows`).

   Expects `side` ('for' or 'against'), `text`, `author`, `source`. #}
<div class="argument-row">
  <label class="argument-text">Citation
    <textarea name="arguments_{{ side }}_text" rows="3"
              placeholder="Le passage, recopié mot pour mot">{{ text }}</textarea>
  </label>
  <div class="argument-meta">
    <label>Auteur
      <input type="text" name="arguments_{{ side }}_author" value="{{ author }}"
             placeholder="Mme Louise Morel (rapporteure)">
    </label>
    <label>Source
      <input type="url" name="arguments_{{ side }}_source" value="{{ source }}"
             placeholder="https://…">
    </label>
  </div>
  {# Clears the row; empty rows are skipped on save. #}
  <button type="button" class="link-danger remove-argument">Retirer</button>
</div>
