# Runs on every pull request and on master. The `master` ruleset requires the
# first two jobs to pass before merging (see DEPLOY.md). On master, the image
# tested here is pushed to ghcr.io, then the deployment waits for an approval
# (environment `production`).
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege; jobs widen it where needed.
permissions:
  contents: read

# A new push to a pull request cancels its previous run. On master each run has
# its own group: a run waiting for deployment approval must not hold back the
# next commit's checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA (a tag can be moved); Dependabot
      # keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same commands as in README.md, in the same image.
      - name: Image de développement
        run: docker compose -f docker-compose.dev.yml build app

      - name: ruff check
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app ruff check --output-format=github .

      - name: ruff format
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app ruff format --check .

      - name: mypy
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app mypy

      - name: pytest
        run: docker compose -f docker-compose.dev.yml run --rm app pytest

  image:
    name: Image et pile de prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Provenance attestation of the published image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `source` label links the package to this repository on ghcr.io.
      - name: Image de production
        run: |
          docker build --target base \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag votations-app:local .

      - name: Essai de la pile de production
        run: scripts/ci_smoke.sh

      # The image pushed is the one that was just tested, not a rebuild.
      - name: Publication sur ghcr.io
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag votations-app:local "$image:sha-$GITHUB_SHA"
          docker push --quiet "$image:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA")
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # Lets anyone check the image was built here, from this commit:
      #   gh attestation verify oci://ghcr.io/<owner>/votations:sha-<commit> -R <owner>/votations
      - name: Attestation de provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Déconnexion de ghcr.io
        if: always() && steps.push.outcome != 'skipped'
        run: docker logout ghcr.io

  deploy:
    name: Déploiement
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers and the SSH secrets are set on this environment (see
    # DEPLOY.md). The job waits here until someone approves.
    environment: production
    # One deployment at a time. A newer commit waiting for approval replaces an
    # older one that is still waiting.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The key can only run scripts/deploy.sh on the server (forced command),
      # which reads the commit from the SSH command line.
      - name: Déploiement sur le serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Suppression de la clé
        if: always()
        run: rm -f ~/.ssh/deploy
