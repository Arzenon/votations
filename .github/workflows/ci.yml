# Checks every pull request. On master, also pushes the tested image to ghcr.io
# and deploys it once approved (see DEPLOY.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# On master each run gets its own group, so a run waiting for approval doesn't
# hold back the next commit's checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same commands as README.md.
      - name: Build the dev image
        run: docker compose -f docker-compose.dev.yml build app

      - name: ruff check
        run: docker compose -f docker-compose.dev.yml run --rm app ruff check --output-format=github .

      - name: ruff format
        run: docker compose -f docker-compose.dev.yml run --rm app ruff format --check .

      - name: mypy
        run: docker compose -f docker-compose.dev.yml run --rm app mypy

      - name: pytest
        run: docker compose -f docker-compose.dev.yml run --rm app pytest

  image:
    name: Prod image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `source` label links the package to this repository on ghcr.io.
      - name: Build the production image
        run: |
          docker build --target base \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag votations-app:local .

      - name: Smoke test the production stack
        run: scripts/ci_smoke.sh

      # Pushes the image that was just tested, not a rebuild.
      - name: Push to ghcr.io
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag votations-app:local "$image:sha-$GITHUB_SHA"
          docker push --quiet "$image:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA")
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # Anyone can check the image was built here, from this commit:
      #   gh attestation verify oci://ghcr.io/arzenon/votations:sha-<commit> -R Arzenon/votations
      - name: Attest build provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # A newer commit waiting for approval replaces an older one still waiting.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The key's forced command runs scripts/deploy.sh with the commit.
      - name: Deploy to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
