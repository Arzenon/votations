# Production stack. Unlike the dev stack: no bind mounts, no --reload, no
# sample data, Postgres not exposed (only Caddy), automatic restarts and a
# healthcheck.
#
# Secrets come from .env (gitignored). See DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No read_only here: Postgres needs to write (same for caddy and db-backup).
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: votations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}
      POSTGRES_DB: votations
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votations"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Built once and reused by the job services below.
    image: votations-app:local
    # Required: otherwise Docker builds the last stage (`dev`, with the tests).
    build:
      context: .
      target: base
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Operator settings. Create it with `cp .env.example .env`.
    env_file: .env
    # Imposed by this stack; takes precedence over .env.
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://votations:${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}@db:5432/votations
      # One proxy (Caddy), which overwrites X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "1"
      # Fail at `up` with a clear message.
      SECRET_KEY: ${SECRET_KEY:?définissez SECRET_KEY — voir DEPLOY.md}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?définissez ADMIN_PASSWORD}
      # SEED_ON_START is deliberately absent: it defaults to 0.
    # --no-access-log: the access log would pair IPs with vote times.
    # --forwarded-allow-ips: only trust proxy headers from the compose network.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "${TRUSTED_PROXY_CIDR:-172.16.0.0/12}",
       "--no-access-log"]
    # Read-only filesystem: the app only writes to /tmp (tmpfs, used by
    # Starlette for large form uploads). If a container fails with "Read-only
    # file system", add a tmpfs for that path or remove read_only.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # Memory cap (archives are decompressed in memory).
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/sante', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?définissez SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  insee-refresh:
    image: votations-app:local
    # Built by `app`, not pulled from a registry.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    # Same .env as the app.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://votations:${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}@db:5432/votations
      INSEE_REFRESH_INTERVAL: "2592000"   # read by the shell script, not the app
      HEARTBEAT_FILE: /tmp/refresh-alive
    entrypoint: ["./docker/insee_cron.sh"]
    # Only /tmp is written (heartbeat, and HOME for content-export). Snapshots go
    # to the bind mount.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # The heartbeat is touched after each successful run. The job runs every 30
    # days.
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/refresh-alive -mmin -64800 2>/dev/null | wc -l) -eq 1"]
      interval: 6h
      timeout: 10s
      retries: 2
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 512m

  assemblee-refresh:
    image: votations-app:local
    # Built by `app`, not pulled from a registry.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    # Same .env as the app (AN_DOSSIERS_URL in particular).
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://votations:${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}@db:5432/votations
      AN_REFRESH_INTERVAL: "86400"        # read by the shell script, not the app
      HEARTBEAT_FILE: /tmp/refresh-alive
    entrypoint: ["./docker/assemblee_cron.sh"]
    # Only /tmp is written (heartbeat, and HOME for content-export). Snapshots go
    # to the bind mount.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # Unhealthy if the import stops succeeding.
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/refresh-alive -mmin -2880 2>/dev/null | wc -l) -eq 1"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 10m
    deploy:
      resources:
        limits:
          # The export is ~10 MB zipped and processed in memory.
          memory: 1g

  # Daily export of the editorial content (see scripts/content.py). Separate
  # from db-backup, which covers the votes.
  #
  # Bind mount to ./exports. The directory is committed (.gitkeep), otherwise
  # Docker would create it as root.
  content-export:
    image: votations-app:local
    # Built by `app`, not pulled from a registry.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    # Runs as your user so you own the files (check with `id -u` / `id -g`).
    user: "${EXPORT_UID:-1000}:${EXPORT_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://votations:${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}@db:5432/votations
      CONTENT_EXPORT_INTERVAL: "86400"
      CONTENT_KEEP_DAYS: "5"
      HEARTBEAT_FILE: /tmp/export-alive
      # This uid has no home in the image.
      HOME: /tmp
    entrypoint: ["./docker/content_export.sh"]
    # Only /tmp is written (heartbeat, and HOME for content-export). Snapshots go
    # to the bind mount.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/export-alive -mmin -2880 2>/dev/null | wc -l) -eq 1"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 512m

  # Daily database dump (the votes). Postgres image, for pg_dump.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: votations
      PGPASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD}
      PGDATABASE: votations
      BACKUP_INTERVAL: "86400"     # 24 h
      BACKUP_KEEP_DAYS: "14"
      # Minimum free space, so the backup doesn't fill the database's disk.
      BACKUP_MIN_FREE_MB: "500"
      BACKUP_HEARTBEAT: /tmp/backup-alive
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "loop"]
    # The heartbeat is touched after a verified dump, so a failure shows as
    # unhealthy within a day.
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/backup-alive -mmin -2880 2>/dev/null | wc -l) -eq 1"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 10m

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
